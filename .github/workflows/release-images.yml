name: release-images

# Build and push the SMART chain images (hardhat node + backend API) to GHCR,
# pinned to a version tag. Fires on a version-tag push; workflow_dispatch
# (re)builds an existing tag. The SMART frontend is not built (REALM Studio is
# the UI; it only calls the backend API).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smart-hardhat
            context: contracts
            file: contracts/Dockerfile.hardhat
          - name: smart-backend
            context: backend
            file: backend/Dockerfile
    steps:
      - name: Resolve version
        id: ver
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/micheldumontier/${{ matrix.name }}:${{ steps.ver.outputs.tag }}
          provenance: false
